apiVersion: v1
kind: Namespace
metadata:
  name: <%= namespace %>
  labels:
    caninemanaged: 'true'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: <%= service_account_name %>
  namespace: <%= namespace %>
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: <%= service_account_name %>
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: <%= service_account_name %>
    namespace: <%= namespace %>
---
apiVersion: v1
kind: Secret
metadata:
  name: <%= token_secret_name %>
  namespace: <%= namespace %>
  annotations:
    kubernetes.io/service-account.name: <%= service_account_name %>
type: kubernetes.io/service-account-token
