[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "canine-computer-use"
version = "0.1.0"
description = "An HTTP server that lets AI agents see and drive a Hyprland (Wayland) desktop: Anthropic's computer-use actions plus the accessibility tree"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# PyGObject (for AT-SPI) is usually already there from the distribution (Arch: python-gobject); a venv made with
# --system-site-packages picks it up. browser-use drives the browser over CDP for the browse endpoints (browse.py).
dependencies = ["PyGObject>=3.42", "browser-use>=0.13"]

[project.scripts]
canine-computer-use = "computer_use.__main__:main"

[tool.setuptools]
packages = ["computer_use"]
