packages:
  - name: traefik-ingress
    display_name: Traefik Ingress
    description: Modern ingress controller for routing external traffic to cluster services
    icon: simple-icons:traefikproxy
    default: true
    recommended: true
    install_type: helm
    repo_name: traefik
    repo_url: https://traefik.github.io/charts
    chart_name: traefik
    chart_url: traefik/traefik
    check_command: get deployment traefik
    values:
      providers:
        kubernetesIngress:
          publishedService:
            enabled: true
      ports:
        web:
          port: 8000
          exposedPort: 80
          allowACMEByPass: true
          http:
            redirections:
              entryPoint:
                to: websecure
                scheme: https
        websecure:
          port: 8443
          exposedPort: 443

  - name: nginx-ingress
    display_name: Nginx Ingress (Legacy)
    description: Legacy ingress controller for routing external traffic to cluster services
    icon: simple-icons:nginx
    default: false
    recommended: false
    install_type: helm
    repo_name: ingress-nginx
    repo_url: https://kubernetes.github.io/ingress-nginx
    chart_name: ingress-nginx
    chart_url: ingress-nginx/ingress-nginx
    check_command: get deployment ingress-nginx-controller
    values:
      controller:
        config:
          use-forwarded-headers: "true"
          proxy-real-ip-cidr: "0.0.0.0/0"
          enable-underscores-in-headers: "true"
          proxy-pass-headers: "*"
          proxy-body-size: "0"
          proxy-buffer-size: "16k"
          proxy-buffers-number: "8"
          proxy-busy-buffers-size: "32k"
          proxy-read-timeout: "3600"
          proxy-send-timeout: "3600"
          h2-backend: "true"
          hsts: "true"
          hsts-max-age: "63072000"
          hsts-include-subdomains: "true"
          hsts-preload: "true"
          enable-gzip: "true"
          gzip-types: "text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript"

  - name: cert-manager
    display_name: Cert Manager
    description: Automatic TLS certificate management with Let's Encrypt
    icon: mdi:certificate-outline
    default: true
    recommended: true
    install_type: helm_and_manifest
    repo_name: jetstack
    repo_url: https://charts.jetstack.io
    chart_name: cert-manager
    chart_url: jetstack/cert-manager
    chart_version: v1.15.3
    check_command: get clusterissuer letsencrypt
    values:
      crds:
        enabled: true

  - name: metrics-server
    display_name: Metrics Server
    description: Cluster resource metrics collection for autoscaling and monitoring
    icon: mdi:chart-line
    default: true
    recommended: true
    install_type: manifest
    manifest_path: resources/k8/shared/metrics_server.yaml
    check_command: get deployment metrics-server

  - name: telepresence
    display_name: Telepresence
    description: Local development against a remote Kubernetes cluster
    icon: mdi:remote-desktop
    default: true
    recommended: false
    install_type: helm
    repo_name: datawire
    repo_url: https://getambassador.io
    chart_name: traffic-manager
    chart_url: datawire/telepresence
    check_command: get deployment traffic-manager

  - name: fluent-bit
    display_name: Log Drain (AWS)
    description: Ship container logs to AWS S3 using Fluent Bit
    icon: simple-icons:amazonaws
    default: false
    recommended: false
    install_type: helm
    repo_name: fluent
    repo_url: https://fluent.github.io/helm-charts
    chart_name: fluent-bit
    chart_url: fluent/fluent-bit
    check_command: get daemonset fluent-bit
    help_text: 'Deploys Fluent Bit as a DaemonSet to collect container logs and ship them to an S3 bucket. Requires an IAM user with <code>s3:PutObject</code> and <code>s3:GetBucketLocation</code> permissions on the target bucket.'
    template:
      - name: AWS Region
        key: aws_region
        type: enum
        required: true
        options:
          - us-east-1
          - us-east-2
          - us-west-1
          - us-west-2
          - eu-west-1
          - eu-west-2
          - eu-west-3
          - eu-central-1
          - ap-southeast-1
          - ap-southeast-2
          - ap-northeast-1
          - ap-northeast-2
          - ap-south-1
          - ca-central-1
          - sa-east-1
      - name: S3 Bucket Name
        key: s3_bucket
        type: string
        required: true
        placeholder: my-cluster-logs
        pattern: ^[a-z0-9][a-z0-9.\-]{1,61}[a-z0-9]$
        pattern_hint: "Bucket name only (e.g. my-cluster-logs). Do not include s3:// or paths."
      - name: AWS Access Key ID
        key: aws_access_key_id
        type: string
        required: true
        placeholder: AKIAIOSFODNN7EXAMPLE
        pattern: ^AKIA[0-9A-Z]{16}$
        pattern_hint: "Must be a valid AWS access key ID starting with AKIA followed by 16 uppercase alphanumeric characters."
      - name: AWS Secret Access Key
        key: aws_secret_access_key
        type: password
        required: true
        pattern: ^[A-Za-z0-9/+=]{40}$
        pattern_hint: "Must be a valid 40-character AWS secret access key."

  - name: cloudflared
    display_name: Cloudflare Tunnel
    description: Secure tunnel to expose cluster services through Cloudflare
    icon: simple-icons:cloudflare
    default: false
    recommended: false
    install_type: helm
    repo_name: cloudflare
    repo_url: https://cloudflare.github.io/helm-charts
    chart_name: cloudflare-tunnel
    chart_url: cloudflare/cloudflare-tunnel
    check_command: get deployment cloudflare-tunnel
    help_text: 'To find your tunnel token: go to <a href="https://one.dash.cloudflare.com/" target="_blank" class="link link-primary">Cloudflare Zero Trust</a> → Networks → Tunnels → select your tunnel → Install and run a connector. Copy the token from the install command (the value after --token).'
    template:
      - name: Tunnel Token
        key: credentials.token
        type: string
        required: true
